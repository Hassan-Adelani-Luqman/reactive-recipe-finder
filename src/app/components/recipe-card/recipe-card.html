<article class="recipe-card">
  <div class="recipe-card__image-wrap">
    <img
      [src]="recipe().image.large"
      [srcset]="recipe().image.small + ' 480w, ' + recipe().image.large + ' 800w'"
      sizes="(max-width: 640px) 100vw, 400px"
      [alt]="recipe().title"
      class="recipe-card__image"
      loading="lazy"
    />
  </div>

  <div class="recipe-card__body">
    <h3 class="recipe-card__title">{{ recipe().title }}</h3>
    <p class="recipe-card__overview">{{ recipe().overview }}</p>

    <div class="recipe-card__meta">
      <span class="recipe-card__meta-item">
        <img src="assets/images/icon-servings.svg" alt="" width="16" height="16" aria-hidden="true" />
        <span>Servings: {{ recipe().servings }}</span>
      </span>
      <span class="recipe-card__meta-item">
        <img src="assets/images/icon-prep-time.svg" alt="" width="16" height="16" aria-hidden="true" />
        <span>Prep: {{ recipe().prepMinutes }} mins</span>
      </span>
      <span class="recipe-card__meta-item">
        <img src="assets/images/icon-cook-time.svg" alt="" width="16" height="16" aria-hidden="true" />
        <span>Cook: {{ recipe().cookMinutes }} min</span>
      </span>
    </div>

    <a [routerLink]="['/recipes', recipe().slug]" class="btn-primary recipe-card__btn">View Recipe</a>
  </div>
</article>

<style>
  :host {
    display: contents;
  }

  .recipe-card {
    background-color: var(--color-white);
    border-radius: 1rem;
    border: 1px solid rgba(30, 58, 47, 0.1);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 2px 8px rgba(30, 58, 47, 0.06);
    transition: box-shadow 0.2s, transform 0.2s;
  }

  .recipe-card:hover {
    box-shadow: 0 6px 20px rgba(30, 58, 47, 0.13);
    transform: translateY(-3px);
  }

  /* Image sits inset with padding — gap visible between image and card border */
  .recipe-card__image-wrap {
    padding: 0.75rem 0.75rem 0;
  }

  .recipe-card__image {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 0.625rem;
    display: block;
    transition: transform 0.3s ease;
  }

  .recipe-card:hover .recipe-card__image {
    transform: scale(1.03);
  }

  .recipe-card__body {
    padding: 1rem 1.25rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    flex: 1;
  }

  .recipe-card__title {
    font-family: var(--font-heading);
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--color-primary);
    line-height: 1.3;
  }

  .recipe-card__overview {
    font-size: 0.875rem;
    color: var(--color-text-muted);
    line-height: 1.5;
  }

  .recipe-card__meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1.25rem;
    margin-top: 0.5rem;
    margin-bottom: 0.25rem;
  }

  .recipe-card__meta-item {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.825rem;
    color: var(--color-text-muted);
    white-space: nowrap;
  }

  .recipe-card__btn {
    display: block;
    text-align: center;
    margin-top: auto;
    padding-top: 0.875rem;
    padding-bottom: 0.875rem;
    font-size: 0.9rem;
    border-radius: 50px;
  }

  .recipe-card__btn:focus-visible {
    outline: 2px solid var(--color-primary);
    outline-offset: 3px;
  }
</style>
